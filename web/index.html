<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课续 · 课程维护</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header><a href="/" class="brand"><span class="logo">续</span><span>课续<small>COURSE MAINTENANCE</small></span></a><div class="header-right"><span class="privacy">本地工作 · 无学员数据</span><button class="ghost" id="provider-open">AI 连接状态</button></div></header>
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="editor"><form id="proposal-form"><div class="dialog-head"><div><p class="eyebrow">人工维护建议</p><h2>按来源修改一处内容</h2></div><button type="button" class="icon" data-close="editor" aria-label="关闭">×</button></div><label>选择课程内容<select id="edit-target" required></select></label><div id="edit-fields"></div><label>修改理由<textarea id="edit-rationale" required rows="2"></textarea></label><div class="field-row"><label>新版资料起始行<input id="edit-start" type="number" min="1" required></label><label>结束行<input id="edit-end" type="number" min="1" required></label></div><p class="hint">引用会取完整行原文。它只能验证出处存在，仍需你判断是否支持修改。</p><label class="check"><input id="edit-conflict" type="checkbox">资料有冲突，需要审批时记录处理理由</label><button class="primary" type="submit">保存为待审建议</button></form></dialog>
<dialog id="provider-dialog"><div class="dialog-head"><div><p class="eyebrow">执行方式</p><h2>真实 AI 连接</h2></div><button class="icon" data-close="provider-dialog" aria-label="关闭">×</button></div><div id="provider-content"></div></dialog>
<script src="/static/app.js"></script></body></html>
